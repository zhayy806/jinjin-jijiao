{% extends "base.html" %}

{% block title %}斤两换算 · 美食点单{% endblock %}

{% block content %}
<section class="converter">
  <h1>看看这到底是多少</h1>
  <p class="subtitle">选食材、填重量，点一下，马上告诉你。</p>

  <div class="card">
    <div class="row">
      <label>食材
        <select id="food">
          {% for name in foods %}
          <option value="{{ name }}">{{ name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>重量
        <input id="amount" type="number" step="0.1" value="300" min="0">
      </label>
      <label>单位
        <select id="unit">
          <option value="克">克</option>
          <option value="两">两</option>
          <option value="斤">斤</option>
          <option value="个">个</option>
          <option value="只">只</option>
          <option value="条">条</option>
          <option value="根">根</option>
          <option value="颗">颗</option>
          <option value="块">块</option>
          <option value="把">把</option>
        </select>
      </label>
    </div>
    <button onclick="convert()">换算看看</button>

    <div id="result" class="result hidden">
      <div class="big-line" id="result-analogy"></div>
      <img id="visual" class="visual" alt="斤两可视化示意图">
      <div class="sub-line" id="result-weight"></div>
      <div class="price-line" id="result-price"></div>
    </div>
  </div>
</section>

<script>
async function convert() {
  const food = document.getElementById('food').value;
  const amount = document.getElementById('amount').value;
  const unit = document.getElementById('unit').value;
  const resp = await fetch(`/api/convert?food=${encodeURIComponent(food)}&amount=${amount}&unit=${encodeURIComponent(unit)}`);
  const data = await resp.json();
  if (data.error) {
    document.getElementById('result-analogy').textContent = data.error;
    document.getElementById('result-weight').textContent = '';
    document.getElementById('result-price').textContent = '';
  } else {
    document.getElementById('result-analogy').textContent = `${data.input} ${data.food} ${data.analogy}`;
    document.getElementById('visual').src = `/api/visual?food=${encodeURIComponent(food)}&amount=${amount}&unit=${encodeURIComponent(unit)}`;
    document.getElementById('result-weight').textContent = `也就是 ${data.grams} 克 = ${data.jin} 斤 = ${data.liang} 两`;
    if (data.price == null) {
      document.getElementById('result-price').textContent = '暂无价格数据（新发地未收录该食材）';
    } else {
      let priceText = `批发参考价：约 ${data.price} 元（每斤 ${data.price_per_jin} 元）`;
      if (data.updated_at) priceText += ` · 更新于 ${data.updated_at}`;
      document.getElementById('result-price').textContent = priceText;
    }
  }
  document.getElementById('result').classList.remove('hidden');
}
</script>
{% endblock %}
